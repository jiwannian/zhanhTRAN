name: Test And Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python -m coverage run --source=src -m unittest discover -s tests -p '*_test.py'
      - run: python -m coverage report --fail-under=80
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: zhanhTRAN-xpi
          path: dist/*.xpi
